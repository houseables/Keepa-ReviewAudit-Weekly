name: Weekly Keepa Pull

on:
  schedule:
    - cron: '0 13 * * 0'   # Every Monday at 1pm UTC — adjust for your timezone
  workflow_dispatch:        # Adds a manual "Run workflow" button in the Actions tab

jobs:
  run-keepa-pull:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Keepa pull
        env:
          KEEPA: ${{ secrets.KEEPA }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          STAGGER_SHEET_ID: ${{ secrets.STAGGER_SHEET_ID }}
        run: python Keepa_Pull_Weekly.py